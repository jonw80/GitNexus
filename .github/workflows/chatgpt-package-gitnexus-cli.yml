name: Package GitNexus CLI Bootstrap

on:
  push:
    branches:
      - chatgpt/gitnexus-cli-bootstrap-20260806
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: gitnexus
    steps:
      - name: Check out fork
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gitnexus/package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build

      - name: Verify executable
        run: node dist/cli/index.js --version

      - name: Remove development-only dependencies
        run: npm prune --omit=dev

      - name: Build and split portable Linux x64 bundle
        run: |
          mkdir -p ../bootstrap-artifact
          tar --exclude='.gitnexus' -czf ../bootstrap-artifact/gitnexus-cli-linux-x64-node22.tgz \
            package.json package-lock.json dist hooks scripts skills vendor node_modules
          cd ../bootstrap-artifact
          sha256sum gitnexus-cli-linux-x64-node22.tgz > SHA256SUMS.txt
          split -b 190M -d -a 2 gitnexus-cli-linux-x64-node22.tgz gitnexus-cli-linux-x64-node22.tgz.part-
          sha256sum gitnexus-cli-linux-x64-node22.tgz.part-* > PART_SHA256SUMS.txt
          ../gitnexus/node_modules/.bin/tsx --version > TSX_VERSION.txt || true
          node ../gitnexus/dist/cli/index.js --version > CLI_VERSION.txt
          test -f gitnexus-cli-linux-x64-node22.tgz.part-00
          test -f gitnexus-cli-linux-x64-node22.tgz.part-01
          test -f gitnexus-cli-linux-x64-node22.tgz.part-02

      - name: Upload bundle part 00
        uses: actions/upload-artifact@v4
        with:
          name: gitnexus-cli-part-00
          path: bootstrap-artifact/gitnexus-cli-linux-x64-node22.tgz.part-00
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload bundle part 01
        uses: actions/upload-artifact@v4
        with:
          name: gitnexus-cli-part-01
          path: bootstrap-artifact/gitnexus-cli-linux-x64-node22.tgz.part-01
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload bundle part 02
        uses: actions/upload-artifact@v4
        with:
          name: gitnexus-cli-part-02
          path: bootstrap-artifact/gitnexus-cli-linux-x64-node22.tgz.part-02
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload checksums and version
        uses: actions/upload-artifact@v4
        with:
          name: gitnexus-cli-metadata
          path: |
            bootstrap-artifact/SHA256SUMS.txt
            bootstrap-artifact/PART_SHA256SUMS.txt
            bootstrap-artifact/CLI_VERSION.txt
          if-no-files-found: error
          retention-days: 7
