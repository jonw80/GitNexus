name: UGCT formal layer

# Rebuilds the Lean proofs, checks that the axiom report matches the committed one,
# runs the derivation-ledger rules against it, and recomputes the Fermat-point
# couplings of X_5 from the Picard-Fuchs equation.

on:
  push:
    paths:
      - 'ugct_formal/**'
      - '.github/workflows/ugct-formal.yml'
  pull_request:
    paths:
      - 'ugct_formal/**'
      - '.github/workflows/ugct-formal.yml'
  workflow_dispatch:

jobs:
  lean-and-ledger:
    name: Lean kernel check, axiom report, ledger rules
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch prebuilt Mathlib
        working-directory: ugct_formal/lean
        run: lake exe cache get

      - name: Build (the kernel checks every proof)
        working-directory: ugct_formal/lean
        shell: bash
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log
          if grep -E "declaration uses .sorry." build.log; then
            echo "::error::a proof uses sorry"
            exit 1
          fi

      - name: Axiom report must match the committed report.txt
        working-directory: ugct_formal/lean
        run: |
          lake env lean Report.lean > report.ci.txt
          diff -u report.txt report.ci.txt

      - name: Ledger rules R0-R5 against the Lean report
        working-directory: ugct_formal
        run: python3 -I check_ledger.py derivation_ledger.json --lean lean/report.ci.txt

  fermat-point:
    name: Fermat-point couplings from the Picard-Fuchs equation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mpmath
        run: pip install "mpmath>=1.3"

      - name: Recompute and compare (fails on any mismatch)
        working-directory: ugct_formal
        run: python3 -I fermat_point_couplings.py 40

  block-lattice:
    name: H_3(X_5, Z) and its block lattices from Pham's vanishing cycles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numpy, cypari2 and mpmath
        run: pip install numpy cypari2 mpmath

      - name: Build the lattice and check it (fails on any mismatch)
        working-directory: ugct_formal
        run: python3 -I block_lattice.py

      - name: Test the exact arithmetic and the checks of generations 1-4
        working-directory: ugct_formal
        run: |
          python3 -I prereg/test_exact_forms.py
          python3 -I prereg/test_evolution_gen1_checks.py
          python3 -I prereg/test_evolution_gen2_checks.py
          python3 -I prereg/test_evolution_gen3_checks.py
          python3 -I prereg/test_evolution_gen4_checks.py

      - name: Generation-2 checks, T15 (fails if any check fails)
        working-directory: ugct_formal
        run: python3 -I prereg/evolution_gen2.py

      - name: Generation-3 checks, exact T14 certificate, T16, T17 (fails if any check fails)
        working-directory: ugct_formal
        run: python3 -I prereg/evolution_gen3.py

      - name: Generation-4 checks, T18, T19, T20 (fails if any check fails)
        working-directory: ugct_formal
        run: python3 -I prereg/evolution_gen4.py
