name: UGCT Sage Y4 Chow Tensor Export

on:
  workflow_dispatch:
    inputs:
      allow_proton_pending:
        description: 'Allow proton c_p lattice-QCD certificate to remain pending while enforcing all other frontier closeouts'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    paths:
      - 'ugct_sage_y4/**'
      - 'data_room/**'
      - '.github/workflows/ugct-sage-y4.yml'

jobs:
  sage-y4:
    name: Native Sage Y4 / Ewx certificate pipeline
    runs-on: ubuntu-latest
    container:
      image: sagemath/sagemath:latest
    steps:
      - name: Checkout GitNexus
        uses: actions/checkout@v4

      - name: Show Sage version
        run: sage --version

      - name: Bootstrap public Esole-Yau source archive
        working-directory: ugct_sage_y4
        run: python3 bootstrap_esole_yau_sources.py

      - name: Fetch Jefferson-Turner IntersectionNumbers ancillary package
        working-directory: ugct_sage_y4
        run: python3 fetch_intersectionnumbers_ancillary.py

      - name: Introspect IntersectionNumbers public API
        working-directory: ugct_sage_y4
        run: python3 introspect_intersectionnumbers_api.py

      - name: Extract stable A4/SU(5) model data directly from source formulas
        working-directory: ugct_sage_y4
        run: sage -python extract_a4_direct_model.py

      - name: Run native Sage exact blowup-pushforward engine
        working-directory: ugct_sage_y4
        run: sage -python native_pushforward_core.py

      - name: Optional Wolfram Ewx exact pushforward cross-check
        working-directory: ugct_sage_y4
        run: |
          if command -v wolframscript >/dev/null 2>&1; then
            wolframscript -file run_intersectionnumbers_ewx.wls
          else
            mkdir -p reports
            printf '{"status":"WOLFRAMSCRIPT_NOT_AVAILABLE","driver":"run_intersectionnumbers_ewx.wls","accepted_optional":true}\n' > reports/intersectionnumbers_ewx_run_report.json
            cat reports/intersectionnumbers_ewx_run_report.json
          fi

      - name: Optional Mathics compatibility install
        run: |
          sage -pip install --no-input --force-reinstall 'setuptools<81' 'mathics3<10'

      - name: Optional Mathics IntersectionNumbers Ewx cross-check
        working-directory: ugct_sage_y4
        run: sage -python run_intersectionnumbers_ewx_mathics.py

      - name: Complete resolved-presentation Sage export
        working-directory: ugct_sage_y4
        run: sage -python export_higher_cartan_from_resolved_presentation.sage

      - name: Exact higher-Cartan table from Chow input
        working-directory: ugct_sage_y4
        run: sage -python compute_higher_cartan_exact_values.sage

      - name: Compute exceptional Chow reduction rules
        working-directory: ugct_sage_y4
        run: sage -python compute_exceptional_rules_from_chow.sage

      - name: Extract remaining higher-Cartan requirements
        working-directory: ugct_sage_y4
        run: python3 extract_higher_cartan_requirements.py

      - name: Validate higher-Cartan exact certificate
        working-directory: ugct_sage_y4
        run: python3 validate_higher_cartan_exact_certificate.py

      - name: Export Y4 degree-four tensor
        working-directory: ugct_sage_y4
        run: sage -python run_chow_tensor.sage

      - name: Compute downstream data_room certificate layer
        run: |
          mkdir -p data_room/data
          python3 data_room/scripts/emit_all_certificates.py
          python3 data_room/scripts/compute_pf_basis.py \
            --precision 120 \
            --terms 80 \
            --z-num 1 \
            --z-den 10000000 \
            --out data_room/data/pf_basis.json
          python3 data_room/scripts/compute_gvw_local_certificate.py \
            --pf-basis data_room/data/pf_basis.json \
            --out data_room/data/attractor_intervals.json
          python3 data_room/scripts/compute_axio_dilaton_interval.py \
            --attractor data_room/data/attractor_intervals.json \
            --out data_room/data/axio_dilaton_interval.json
          python3 data_room/scripts/compute_remaining_scoped_certificates.py
          python3 data_room/scripts/assert_all_15_closeout.py

      - name: Validate full UGCT scoped payload
        working-directory: ugct_sage_y4
        run: python3 validate_full_payload.py

      - name: Strict frontier closeout gate
        run: |
          if [ "${{ github.event.inputs.allow_proton_pending || 'true' }}" = "true" ]; then
            python3 data_room/scripts/verify_frontier_closeout.py --allow-proton-pending
          else
            python3 data_room/scripts/verify_frontier_closeout.py
          fi

      - name: Upload tensor, data, sources, reports, and frontier diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ugct-y4-sage-tensor-export
          path: |
            .github/workflows/ugct-sage-y4.yml
            ugct_sage_y4/*.py
            ugct_sage_y4/*.sage
            ugct_sage_y4/*.wls
            ugct_sage_y4/data/*.json
            ugct_sage_y4/reports/*.json
            ugct_sage_y4/reports/*.md
            ugct_sage_y4/reports/*.csv
            ugct_sage_y4/sources/*.m
            ugct_sage_y4/sources/*.nb
            data_room/data/*.json
            data_room/proofs/*.tex
            data_room/scripts/*.py

      - name: Report final UGCT math verification status
        if: always()
        working-directory: ugct_sage_y4
        run: python3 fail_if_math_unverified.py
