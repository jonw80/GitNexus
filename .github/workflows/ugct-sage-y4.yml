name: UGCT Sage Y4 Chow Tensor Export

on:
  workflow_dispatch:
  push:
    paths:
      - 'ugct_sage_y4/**'
      - '.github/workflows/ugct-sage-y4.yml'

jobs:
  sage-y4:
    runs-on: ubuntu-latest
    container:
      image: sagemath/sagemath:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show Sage version
        run: sage --version
      - name: Bootstrap Esole-Yau source data
        working-directory: ugct_sage_y4
        run: python3 bootstrap_esole_yau_sources.py
      - name: Fetch IntersectionNumbers ancillary package
        working-directory: ugct_sage_y4
        run: python3 fetch_intersectionnumbers_ancillary.py
      - name: Introspect IntersectionNumbers API
        working-directory: ugct_sage_y4
        run: python3 introspect_intersectionnumbers_api.py
      - name: Try Wolfram IntersectionNumbers Ewx driver
        working-directory: ugct_sage_y4
        run: |
          if command -v wolframscript >/dev/null 2>&1; then
            wolframscript -file run_intersectionnumbers_ewx.wls || true
          else
            mkdir -p reports
            printf '{"status":"WOLFRAMSCRIPT_NOT_AVAILABLE","driver":"run_intersectionnumbers_ewx.wls"}\n' > reports/intersectionnumbers_ewx_run_report.json
            cat reports/intersectionnumbers_ewx_run_report.json
          fi
      - name: Preinstall Mathics fallback if possible
        run: python3 -m pip install --user --no-input mathics3 || true
      - name: Try Mathics IntersectionNumbers Ewx driver
        working-directory: ugct_sage_y4
        run: python3 run_intersectionnumbers_ewx_mathics.py
      - name: Try pure Sage resolved-presentation export
        working-directory: ugct_sage_y4
        run: sage -python export_higher_cartan_from_resolved_presentation.sage
      - name: Compute exact higher-Cartan Ewx values
        working-directory: ugct_sage_y4
        run: sage -python compute_higher_cartan_exact_values.sage
      - name: Compute Esole-Yau exceptional Chow rules
        working-directory: ugct_sage_y4
        run: sage -python compute_exceptional_rules_from_chow.sage
      - name: Extract higher-Cartan residual requirements
        working-directory: ugct_sage_y4
        run: python3 extract_higher_cartan_requirements.py
      - name: Validate higher-Cartan exact certificate
        working-directory: ugct_sage_y4
        run: python3 validate_higher_cartan_exact_certificate.py
      - name: Run UGCT Y4 Chow tensor export
        working-directory: ugct_sage_y4
        run: sage -python run_chow_tensor.sage
      - name: Run strict full-payload validator
        working-directory: ugct_sage_y4
        run: python3 validate_full_payload.py
      - name: Upload tensor and full-payload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ugct-y4-sage-tensor-export
          path: |
            ugct_sage_y4/data/*.json
            ugct_sage_y4/reports/*.json
            ugct_sage_y4/reports/*.md
            ugct_sage_y4/reports/*.csv
            ugct_sage_y4/sources/*.m
            ugct_sage_y4/sources/*.nb
            ugct_sage_y4/*.wls
      - name: Report UGCT math verification status
        working-directory: ugct_sage_y4
        run: python3 fail_if_math_unverified.py || true
