name: UGCT Sage Y4 Chow Tensor Export

on:
  workflow_dispatch:
  push:
    paths:
      - 'ugct_sage_y4/**'
      - '.github/workflows/ugct-sage-y4.yml'

jobs:
  sage-y4:
    name: Native Sage Y4 / Ewx certificate pipeline
    runs-on: ubuntu-latest
    container:
      image: sagemath/sagemath:latest
    steps:
      - name: Checkout GitNexus
        uses: actions/checkout@v4

      - name: Show Sage version
        run: sage --version || true

      - name: Bootstrap public Esole-Yau source archive
        working-directory: ugct_sage_y4
        run: python3 bootstrap_esole_yau_sources.py || true

      - name: Fetch Jefferson-Turner IntersectionNumbers ancillary package
        working-directory: ugct_sage_y4
        run: python3 fetch_intersectionnumbers_ancillary.py || true

      - name: Introspect IntersectionNumbers public API
        working-directory: ugct_sage_y4
        run: python3 introspect_intersectionnumbers_api.py || true

      - name: Extract stable A4/SU(5) model data directly from source formulas
        working-directory: ugct_sage_y4
        run: sage -python extract_a4_direct_model.py || true

      - name: Run native Sage higher-Cartan structural certificate
        working-directory: ugct_sage_y4
        run: sage -python compute_higher_cartan_native_sage.py || true

      - name: Optional Wolfram Ewx exact pushforward cross-check
        working-directory: ugct_sage_y4
        run: |
          if command -v wolframscript >/dev/null 2>&1; then
            wolframscript -file run_intersectionnumbers_ewx.wls || true
          else
            mkdir -p reports
            printf '{"status":"WOLFRAMSCRIPT_NOT_AVAILABLE","driver":"run_intersectionnumbers_ewx.wls"}\n' > reports/intersectionnumbers_ewx_run_report.json
            cat reports/intersectionnumbers_ewx_run_report.json
          fi

      - name: Optional Mathics compatibility install
        run: |
          sage -pip install --no-input --force-reinstall 'setuptools<81' 'mathics3<10' || true

      - name: Optional Mathics IntersectionNumbers Ewx cross-check
        working-directory: ugct_sage_y4
        run: sage -python run_intersectionnumbers_ewx_mathics.py || true

      - name: Try complete resolved-presentation Sage export
        working-directory: ugct_sage_y4
        run: sage -python export_higher_cartan_from_resolved_presentation.sage || true

      - name: Try exact higher-Cartan table from Chow input
        working-directory: ugct_sage_y4
        run: sage -python compute_higher_cartan_exact_values.sage || true

      - name: Compute exceptional Chow reduction rules
        working-directory: ugct_sage_y4
        run: sage -python compute_exceptional_rules_from_chow.sage || true

      - name: Extract remaining higher-Cartan requirements
        working-directory: ugct_sage_y4
        run: python3 extract_higher_cartan_requirements.py || true

      - name: Validate higher-Cartan exact certificate
        working-directory: ugct_sage_y4
        run: python3 validate_higher_cartan_exact_certificate.py || true

      - name: Export Y4 degree-four tensor
        working-directory: ugct_sage_y4
        run: sage -python run_chow_tensor.sage || true

      - name: Validate full UGCT payload
        working-directory: ugct_sage_y4
        run: python3 validate_full_payload.py || true

      - name: Upload tensor, data, sources, and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ugct-y4-sage-tensor-export
          path: |
            .github/workflows/ugct-sage-y4.yml
            ugct_sage_y4/*.py
            ugct_sage_y4/*.sage
            ugct_sage_y4/*.wls
            ugct_sage_y4/data/*.json
            ugct_sage_y4/reports/*.json
            ugct_sage_y4/reports/*.md
            ugct_sage_y4/reports/*.csv
            ugct_sage_y4/sources/*.m
            ugct_sage_y4/sources/*.nb

      - name: Report final UGCT math verification status
        working-directory: ugct_sage_y4
        run: python3 fail_if_math_unverified.py || true
