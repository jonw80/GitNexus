name: YM Direct Wilson V12 exact certification
on:
  push:
    branches: [chatgpt/ym-direct-wilson-v12-20260916]
    paths:
      - 'data_room/scripts/ym_direct_wilson_v12/**'
      - '.github/workflows/ym-direct-wilson-v12.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calculate-and-independently-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned import dependency
        run: python -m pip install numpy==2.1.3
      - name: Compute exact coefficients and verify all certificates
        run: |
          set -euo pipefail
          python data_room/scripts/ym_direct_wilson_v12/workspace/wilson_closeout_v12/run_certification.py
          test -s data_room/scripts/ym_direct_wilson_v12/workspace/wilson_closeout_v12/EXECUTION_MANIFEST.json
      - name: Retain verified finite-volume calculation
        uses: actions/upload-artifact@v4
        with:
          name: ym-direct-wilson-v12-certified
          if-no-files-found: error
          retention-days: 90
          path: |
            data_room/scripts/ym_direct_wilson_v12/workspace/wilson_closeout_v12/EXECUTION_MANIFEST.json
            data_room/scripts/ym_direct_wilson_v12/workspace/wilson_closeout_v12/design/*.json
            data_room/scripts/ym_direct_wilson_v12/workspace/wilson_closeout_v12/design/*.json.gz
            data_room/scripts/ym_direct_wilson_v12/workspace/wilson_closeout_v12/independent/*.json
            data_room/scripts/ym_direct_wilson_v12/workspace/wilson_closeout_v12/physical/*.json
