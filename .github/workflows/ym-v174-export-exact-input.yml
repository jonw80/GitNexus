name: YM V174 Export Exact Input

on:
  push:
    branches:
      - chatgpt/ym-v174-exact-input-export-20260828

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify exact V174 archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, pathlib, shutil

          root = pathlib.Path('data_room/primary/ym_v174_final/input_v3')
          out = pathlib.Path('v174_exact_export')
          repaired_dir = out / 'input_v3'
          out.mkdir(parents=True, exist_ok=True)
          repaired_dir.mkdir(parents=True, exist_ok=True)

          manifest = json.loads((root / 'manifest.json').read_text())
          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          chunks = []
          audit = []

          shutil.copy2(root / 'manifest.json', repaired_dir / 'manifest.json')
          for ent in manifest['parts']:
              src = root / ent['name']
              s = src.read_text().strip()
              got = hashlib.sha256(s.encode()).hexdigest()
              if len(s) == ent['chars'] and got == ent['sha256']:
                  fixed = s
                  mode = 'exact'
              elif len(s) == ent['chars'] - 1:
                  fixed = None
                  for pos in range(len(s) + 1):
                      for ch in alphabet:
                          cand = s[:pos] + ch + s[pos:]
                          if hashlib.sha256(cand.encode()).hexdigest() == ent['sha256']:
                              fixed = cand
                              mode = f'insert:{pos}:{ch}'
                              break
                      if fixed is not None:
                          break
                  if fixed is None:
                      raise RuntimeError(f'cannot repair {ent["name"]}')
              else:
                  raise RuntimeError(
                      f'{ent["name"]}: got chars={len(s)} sha={got}; '
                      f'expected chars={ent["chars"]} sha={ent["sha256"]}'
                  )

              assert len(fixed) == ent['chars']
              assert hashlib.sha256(fixed.encode()).hexdigest() == ent['sha256']
              (repaired_dir / ent['name']).write_text(fixed)
              chunks.append(fixed)
              audit.append({
                  'name': ent['name'],
                  'input_chars': len(s),
                  'output_chars': len(fixed),
                  'mode': mode,
                  'sha256': hashlib.sha256(fixed.encode()).hexdigest(),
              })

          b64 = ''.join(chunks)
          assert len(b64) == manifest['base64_chars'], (len(b64), manifest['base64_chars'])
          raw = base64.b64decode(b64, validate=True)
          sha = hashlib.sha256(raw).hexdigest()
          assert len(raw) == manifest['archive_bytes'], (len(raw), manifest['archive_bytes'])
          assert sha == manifest['archive_sha256'], (sha, manifest['archive_sha256'])
          (out / 'input.tar.xz').write_bytes(raw)
          (out / 'verification.json').write_text(json.dumps({
              'schema': 'GZYM_V174_EXACT_INPUT_EXPORT_V1',
              'source_branch': 'chatgpt/ym-v174-final-external-reduction-20260824',
              'archive_bytes': len(raw),
              'archive_sha256': sha,
              'base64_chars': len(b64),
              'repairs': audit,
          }, indent=2))
          print('VERIFIED archive_bytes=', len(raw))
          print('VERIFIED archive_sha256=', sha)
          print(json.dumps(audit, indent=2))
          PY
          tar -tJf v174_exact_export/input.tar.xz > v174_exact_export/archive_inventory.txt
          sha256sum v174_exact_export/input.tar.xz | tee v174_exact_export/SHA256SUMS.txt
          wc -c v174_exact_export/input.tar.xz
      - uses: actions/upload-artifact@v4
        with:
          name: v174-exact-input-export
          path: v174_exact_export
          retention-days: 90
          if-no-files-found: error
