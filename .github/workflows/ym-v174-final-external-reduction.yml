name: YM V174 Final External Reduction

on:
  push:
    branches:
      - chatgpt/ym-v174-final-external-reduction-20260824
    paths:
      - '.github/workflows/ym-v174-final-external-reduction.yml'
      - 'data_room/primary/ym_v174_final/**'
      - 'data_room/scripts/ym_v174_final/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ym-v174-final-external-reduction.yml'
      - 'data_room/primary/ym_v174_final/**'
      - 'data_room/scripts/ym_v174_final/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ym-v174-final-external-reduction-20260824
      - name: Inspect compact and V3 payloads
        shell: bash
        run: |
          set -euxo pipefail
          ROOT=data_room/primary/ym_v174_final
          RES="$ROOT/results"
          mkdir -p "$RES" /tmp/v174small /tmp/v174v3

          base64 -d "$ROOT/c10_input.tar.xz.b64" > /tmp/v174small/input.tar.xz
          xz -t /tmp/v174small/input.tar.xz
          sha256sum /tmp/v174small/input.tar.xz | tee "$RES/compact_archive_sha256.txt"
          tar -tJf /tmp/v174small/input.tar.xz | sort | tee "$RES/compact_inventory.txt"
          tar -xJf /tmp/v174small/input.tar.xz -C /tmp/v174small
          find /tmp/v174small -type f -printf '%P %s bytes\n' | sort | tee "$RES/compact_sizes.txt"

          cat "$ROOT"/input_v3/part_* > /tmp/v174v3/input.b64
          if base64 -d /tmp/v174v3/input.b64 > /tmp/v174v3/input.tar.xz 2>/tmp/v174v3/b64.err && xz -t /tmp/v174v3/input.tar.xz 2>/tmp/v174v3/xz.err; then
            echo COMPLETE | tee "$RES/v3_status.txt"
            sha256sum /tmp/v174v3/input.tar.xz | tee "$RES/v3_archive_sha256.txt"
            tar -tJf /tmp/v174v3/input.tar.xz | sort | tee "$RES/v3_inventory.txt"
            tar -xJf /tmp/v174v3/input.tar.xz -C /tmp/v174v3
            find /tmp/v174v3 -type f -printf '%P %s bytes\n' | sort | tee "$RES/v3_sizes.txt"
          else
            echo INCOMPLETE | tee "$RES/v3_status.txt"
            printf 'parts=' >> "$RES/v3_status.txt"
            ls "$ROOT"/input_v3/part_* | wc -l >> "$RES/v3_status.txt"
            tail -c 32 /tmp/v174v3/input.b64 | tr -d '\n' | sed 's/^/tail=/' >> "$RES/v3_status.txt"
            echo >> "$RES/v3_status.txt"
          fi
      - name: Upload inspection results
        uses: actions/upload-artifact@v4
        with:
          name: ym-v174-payload-inspection
          path: data_room/primary/ym_v174_final/results/
          if-no-files-found: error
