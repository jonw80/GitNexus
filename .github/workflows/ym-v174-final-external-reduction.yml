name: YM V174 Final External Reduction (V197 custody repaired)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIN_NUMPY: '2.1.3'
  PIN_SCIPY: '1.14.1'
  PIN_OPT_EINSUM: '3.4.0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'
  PYTHONUNBUFFERED: '1'

jobs:
  external-norm:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned custody stack
        run: python -m pip install --disable-pip-version-check "numpy==${PIN_NUMPY}" "scipy==${PIN_SCIPY}" "opt_einsum==${PIN_OPT_EINSUM}"
      - name: Record runtime provenance
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/v174-output"
          mkdir -p "$OUT"
          python --version > "$OUT/python-version.txt" 2>&1
          python -m pip freeze | sort > "$OUT/pip-freeze.txt"
          lscpu > "$OUT/lscpu.txt"
          git rev-parse HEAD > "$OUT/workflow-head.txt"
          python - <<'PY' > "$OUT/numerical-stack.txt"
          import numpy, scipy, opt_einsum
          print('numpy='+numpy.__version__)
          print('scipy='+scipy.__version__)
          print('opt_einsum='+opt_einsum.__version__)
          numpy.show_config()
          PY
      - name: Reconstruct exact V174 input
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/v174-v3"
          OUT="$RUNNER_TEMP/v174-output"
          mkdir -p "$WORK/extract" "$OUT"
          python - <<'PY'
          import json,hashlib,pathlib,base64,lzma,os
          root=pathlib.Path('data_room/primary/ym_v174_final/input_v3')
          m=json.loads((root/'manifest.json').read_text())
          alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          repaired=[]; audit=[]
          for ent in m['parts']:
              s=(root/ent['name']).read_text().strip(); got=hashlib.sha256(s.encode()).hexdigest()
              if len(s)==ent['chars'] and got==ent['sha256']:
                  rs=s; mode='exact'
              elif len(s)==ent['chars']-1:
                  rs=None
                  for pos in range(len(s)+1):
                      for ch in alphabet:
                          cand=s[:pos]+ch+s[pos:]
                          if hashlib.sha256(cand.encode()).hexdigest()==ent['sha256']:
                              rs=cand; mode=f'insert:{pos}:{ch}'; break
                      if rs is not None: break
                  if rs is None: raise RuntimeError(f'unable to repair {ent["name"]}')
              else:
                  raise RuntimeError(f'unexpected shard {ent["name"]}: len={len(s)} expected={ent["chars"]} sha={got}')
              repaired.append(rs)
              audit.append({'name':ent['name'],'input_chars':len(s),'output_chars':len(rs),'mode':mode,'sha256':hashlib.sha256(rs.encode()).hexdigest()})
          b64=''.join(repaired)
          assert len(b64)==m['base64_chars']
          raw=base64.b64decode(b64,validate=True)
          sha=hashlib.sha256(raw).hexdigest()
          assert sha==m['archive_sha256'] and len(raw)==m['archive_bytes']
          lzma.decompress(raw)
          work=pathlib.Path(os.environ['RUNNER_TEMP'])/'v174-v3'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'v174-output'
          (work/'input.tar.xz').write_bytes(raw)
          (out/'v3_repair_audit.json').write_text(json.dumps({'schema':'GZYM_V174_V3_REPAIR_AUDIT','manifest':m,'repairs':audit,'archive_sha256':sha,'archive_bytes':len(raw)},indent=2))
          PY
          tar -xJf "$WORK/input.tar.xz" -C "$WORK/extract"
          find "$WORK/extract" -type f -printf '%P %s bytes\n' | sort > "$OUT/v3_sizes.txt"
      - name: Decode and verify immutable custody reducer
        shell: bash
        run: |
          set -euo pipefail
          RED="$RUNNER_TEMP/run_external_norm.py"
          git show 0d81eccf2d1123a69ac75fb2cf0e9d87eefea09a:data_room/scripts/ym_v174_final/run_external_norm.py.xz.b64 \
            | tr -d '\r\n' | base64 --decode | xz --decompress --stdout > "$RED"
          echo "032078134a07145c1ca06b80ed695055ec52aafc04f6918d07f4c9d0a24339b3  $RED" | sha256sum -c -
          sha256sum "$RED" > "$RUNNER_TEMP/v174-output/reducer.sha256"
          python -m py_compile "$RED"
      - name: Run finite Q-projected external reduction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v174-cache"
          export V174_INPUT="$RUNNER_TEMP/v174-v3/extract"
          export V174_OUT="$RUNNER_TEMP/v174-output"
          export V174_CACHE="$RUNNER_TEMP/v174-cache"
          /usr/bin/time -v python "$RUNNER_TEMP/run_external_norm.py" 2>&1 | tee "$RUNNER_TEMP/v174-output/run.log"
      - name: Verify and quarantine component-10 result pending six-channel custody
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,hashlib
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'v174-output'
          p=out/'a10_B10_component10.json'
          r=json.loads(p.read_text()); checks=r['checks']
          assert r['schema']=='GZYM_V174_A10_B10_V1'
          assert checks['crossing_self_adjoint_pass']
          assert checks['crossing_expected_pass']
          assert checks['Q_projection_pass']
          assert checks['B10_psd']
          assert r['D_raw_W_norm2'] >= 0
          assert r['B10_1_star_B10_1'] >= -1e-10
          audit={
            'schema':'GZYM_V197_COMPONENT10_EXTERNAL_DIAGNOSTIC_V1',
            'result_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
            'critical_component':10,
            'critical_component_order':[10,0,15,4,8,1],
            'G10_authoritative':204.7027392787848,
            'G10_result':r['G10'],
            'A10':r['A10'],
            'D_raw_W_norm2':r['D_raw_W_norm2'],
            'M2':r['M2'],
            'B10_1_star_B10_1':r['B10_1_star_B10_1'],
            'checks':checks,
            'proof_grade':False,
            'quarantine_reason':'component10-only moment data cannot advance Feshbach/Lanczos until six-channel crossing custody is complete for components 8 and 1 and the raw-R invariant mismatch is resolved'
          }
          (out/'V197_component10_quarantine.json').write_text(json.dumps(audit,indent=2))
          print(json.dumps(audit,indent=2))
          PY
      - name: Upload V174/V197 external diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ym-v197-component10-external-diagnostic
          path: ${{ runner.temp }}/v174-output/
          if-no-files-found: warn
          retention-days: 90
