name: YM V174 Final External Reduction

on:
  push:
    branches:
      - chatgpt/ym-v174-final-external-reduction-20260824
    paths:
      - '.github/workflows/ym-v174-final-external-reduction.yml'
      - 'data_room/primary/ym_v174_final/input_v3/**'
      - 'data_room/scripts/ym_v174_final/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ym-v174-final-external-reduction-20260824
      - name: Reconstruct and inspect V174 input_v3
        shell: bash
        run: |
          set -euxo pipefail
          ROOT=data_room/primary/ym_v174_final
          mkdir -p "$ROOT/results" /tmp/v174v3
          cat "$ROOT"/input_v3/part_* | base64 -d > /tmp/v174v3/input.tar.xz
          xz -t /tmp/v174v3/input.tar.xz
          sha256sum /tmp/v174v3/input.tar.xz | tee "$ROOT/results/v3_archive_sha256.txt"
          tar -tJf /tmp/v174v3/input.tar.xz | sort | tee "$ROOT/results/v3_inventory.txt"
          tar -xJf /tmp/v174v3/input.tar.xz -C /tmp/v174v3
          find /tmp/v174v3 -type f -printf '%P %s bytes\n' | sort | tee "$ROOT/results/v3_sizes.txt"
      - name: Commit inspection results
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data_room/primary/ym_v174_final/results/
          if git diff --cached --quiet; then
            echo 'No new inspection results'
          else
            git commit -m 'Record V174 input_v3 inventory'
            git push origin HEAD:chatgpt/ym-v174-final-external-reduction-20260824
          fi
