  actions: write

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch custody-pinned seeded closeout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run ym-v174-seeded-final-external-reduction.yml \
            --repo jonw80/GitNexus \
            --ref chatgpt/ym-v174-phase-rootcause-20260831
