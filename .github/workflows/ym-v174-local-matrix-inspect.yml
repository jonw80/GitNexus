name: YM V174 Local Matrix Inspect
on:
  push:
    branches:
      - chatgpt/ym-v174-phase-rootcause-20260831
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode reducer and print numerical kernels
        shell: bash
        run: |
          set -euo pipefail
          RED="$RUNNER_TEMP/reducer.py"
          git show 0d81eccf2d1123a69ac75fb2cf0e9d87eefea09a:data_room/scripts/ym_v174_final/run_external_norm.py.xz.b64 \
            | tr -d '\r\n' | base64 --decode | xz --decompress --stdout > "$RED"
          sha256sum "$RED"
          python - "$RED" <<'PY'
          import ast,sys
          p=sys.argv[1]; src=open(p).read(); lines=src.splitlines(); tree=ast.parse(src)
          wanted={'local_matrix','get_inv','get_action_cg','null_basis','transition_choices','low_raw_C','recover_phase','invariant_basis','inv_basis','canonicalize_basis','su3_invariant_basis'}
          for node in tree.body:
              if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and node.name in wanted:
                  print(f'===== {node.name} lines {node.lineno}-{node.end_lineno} =====')
                  print('\n'.join(lines[node.lineno-1:node.end_lineno]))
          print('===== SVD/LINALG/CUTOFF CALLS =====')
          for i,line in enumerate(lines,1):
              if any(tok in line for tok in ('svd','eigh','eig','qr','null_space','lstsq','pinv','matrix_rank','1e-13','1e-14','1e-12')):
                  print(f'{i}: {line}')
          PY
