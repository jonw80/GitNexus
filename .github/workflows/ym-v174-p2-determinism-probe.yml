name: YM V174 P2 Determinism Probe
on:
  push:
    branches:
      - chatgpt/ym-v174-phase-rootcause-20260831
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install custody stack
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 scipy==1.14.1 opt_einsum==3.4.0
      - name: Reconstruct exact payload and reducer
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/p2det"; mkdir -p "$W/extract" "$W/out"
          python - <<'PY'
          import json,hashlib,pathlib,base64,os
          root=pathlib.Path('data_room/primary/ym_v174_final/input_v3'); m=json.loads((root/'manifest.json').read_text())
          alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          repaired=[]
          for ent in m['parts']:
              s=(root/ent['name']).read_text().strip(); got=hashlib.sha256(s.encode()).hexdigest()
              if len(s)==ent['chars'] and got==ent['sha256']: rs=s
              elif len(s)==ent['chars']-1:
                  rs=None
                  for pos in range(len(s)+1):
                      for ch in alphabet:
                          cand=s[:pos]+ch+s[pos:]
                          if hashlib.sha256(cand.encode()).hexdigest()==ent['sha256']: rs=cand; break
                      if rs is not None: break
                  if rs is None: raise RuntimeError(ent['name'])
              else: raise RuntimeError((ent['name'],len(s),got))
              repaired.append(rs)
          raw=base64.b64decode(''.join(repaired),validate=True)
          assert len(raw)==74708 and hashlib.sha256(raw).hexdigest()=='b61862df391281c9920569215c8757d6e7b6e204aaa9936dd8fe189bbe43af1a'
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'p2det'/'input.tar.xz'; p.write_bytes(raw)
          PY
          tar -xJf "$W/input.tar.xz" -C "$W/extract"
          git show 0d81eccf2d1123a69ac75fb2cf0e9d87eefea09a:data_room/scripts/ym_v174_final/run_external_norm.py.xz.b64 | tr -d '\r\n' | base64 --decode | xz --decompress --stdout > "$W/reducer.py"
          sha256sum "$W/reducer.py"
      - name: Inspect and repeat P2 construction
        shell: bash
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          PYTHONHASHSEED: '0'
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          export V174_INPUT="$RUNNER_TEMP/p2det/extract"
          export V174_OUT="$RUNNER_TEMP/p2det/out"
          export RED="$RUNNER_TEMP/p2det/reducer.py"
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/p2det/out/probe.log"
          import os,sys,inspect,importlib.util,hashlib,tempfile,pathlib,numpy as np,scipy,scipy.sparse as sp
          print('PY',sys.version); print('NUMPY',np.__version__,'SCIPY',scipy.__version__)
          np.show_config()
          spec=importlib.util.spec_from_file_location('ren',os.environ['RED']); ren=importlib.util.module_from_spec(spec); spec.loader.exec_module(ren)
          print('--- low_raw_C source ---'); print(inspect.getsource(ren.low_raw_C))
          print('--- recover_phase source ---'); print(inspect.getsource(ren.recover_phase))
          def hC(C):
              C=C.tocsr(); h=hashlib.sha256(); h.update(C.indptr.tobytes()); h.update(C.indices.tobytes()); h.update(C.data.tobytes()); return h.hexdigest()
          rows=[]
          for seed in (0,1,2):
              np.random.seed(seed)
              cache=pathlib.Path(os.environ['RUNNER_TEMP'])/f'p2det/cache_{seed}'; cache.mkdir(exist_ok=True)
              ren.CACHE=cache
              C,out=ren.low_raw_C(); s,ncc,contr,eigres,logc=ren.recover_phase(C)
              M=(ren.A*(C@sp.diags(s.astype(float)))+sp.diags(logc)).tocsr(); D=(M-M.T).tocoo(); sym=float(np.abs(D.data).max()) if D.nnz else 0.0
              row=(seed,int(C.nnz),hC(C),int(out),int(ncc),int(contr),float(eigres),sym)
              rows.append(row); print('RESULT',row,flush=True)
          print('ALL_EQUAL_C',len({(r[1],r[2]) for r in rows})==1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v174-p2-determinism-probe
          path: ${{ runner.temp }}/p2det/out/
          if-no-files-found: error
