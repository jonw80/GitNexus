name: YM V174 Two-Phase External Reduction

# Splits the reduction into the part that needs memory and the part that does not.
#
# Phase 1 (inventory) walks the crossing purely for its side effects, discarding
# the accumulators so they never compete with LAPACK, and caches every
# intertwiner solve. The largest, 9142x4824, needs ~2.0 GiB for dgesdd alone
# (U 0.33 + Vh 0.17 + workspace ~7n^2 = 1.21 + M 0.33) and OOM-kills a 4 GiB box
# even with the accumulators empty. It then hashes the result into a manifest and
# publishes it as an artifact.
#
# Phase 2 (reduce) restores that inventory, VERIFIES it against the manifest, and
# runs crossing -> merge -> emit -> reduce. It never opens a large SVD, so it
# needs roughly 1 GiB and runs anywhere.
#
# The pinning matters beyond memory. robust_null_space falls back from gesdd to
# gesvd whenever gesdd raises LinAlgError, and whether gesdd converges is version
# and platform dependent -- so which driver produces a given intertwiner basis is
# not currently fixed across machines. Pinning the inventory by hash makes every
# later run consume exactly the bases the pinned run produced, which turns the
# reduction into a deterministic function of an auditable artifact.

on:
  workflow_dispatch:
    inputs:
      run_phase2:
        description: 'Also run the reduction after building the inventory'
        type: boolean
        default: true

permissions:
  contents: read

env:
  PIN_NUMPY: '2.1.3'
  PIN_SCIPY: '1.14.1'
  # Forced by B*B = ||(I - VV*)Y||^2 >= 0. Cauchy-Schwarz gives only
  # 515.85567979296883742, weaker by 0.233%, so this is the binding check.
  # A_10 does not involve the norm and cannot detect a violation.
  N_D_FLOOR: '517.05823521403812592'

jobs:
  inventory:
    name: Phase 1 - build and pin the CG inventory
    runs-on: ubuntu-latest      # 16 GiB; the 9142x4824 solve needs ~8 GiB headroom
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical dependencies
        run: python -m pip install --disable-pip-version-check "numpy==${PIN_NUMPY}" "scipy==${PIN_SCIPY}" opt_einsum
      - name: Report available memory
        run: free -g; nproc
      - name: Reconstruct and repair input_v3
        shell: bash
        run: bash data_room/scripts/ym_v174_final/reassemble_input_v3.sh
      - name: Decode reducer
        shell: bash
        run: |
          python - <<'PY'
          import base64, lzma, pathlib, os
          b = pathlib.Path('data_room/scripts/ym_v174_final/run_external_norm.py.xz.b64').read_text()
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'run_external_norm.py'
          out.write_bytes(lzma.decompress(base64.b64decode(b)))
          print('decoded', out, out.stat().st_size, 'bytes')
          PY
      - name: Build CG inventory
        env:
          V174_INPUT: ${{ runner.temp }}/v174-v3/extract
          V174_OUT: ${{ runner.temp }}/v174-out
          V174_CACHE: ${{ runner.temp }}/v174-cache
          V174_REDUCER: ${{ runner.temp }}/run_external_norm.py
        run: |
          mkdir -p "$V174_OUT" "$V174_CACHE"
          python data_room/scripts/ym_v174_final/build_cg_inventory.py --build
      - name: Pin the inventory
        env:
          V174_CACHE: ${{ runner.temp }}/v174-cache
        run: |
          python data_room/scripts/ym_v174_final/build_cg_inventory.py \
            --manifest "$RUNNER_TEMP/cg_inventory_manifest.json"
          cp "$RUNNER_TEMP/cg_inventory_manifest.json" .
      - name: Package inventory
        run: tar czf "$RUNNER_TEMP/cg_inventory.tar.gz" -C "$RUNNER_TEMP" v174-cache
      - uses: actions/upload-artifact@v4
        with:
          name: v174-cg-inventory
          path: |
            ${{ runner.temp }}/cg_inventory.tar.gz
            cg_inventory_manifest.json
          retention-days: 90

  cross:
    name: Phase 2a - crossing shard ${{ matrix.shard }}/8
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false          # one bad shard must not hide the others
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "numpy==${PIN_NUMPY}" "scipy==${PIN_SCIPY}" opt_einsum
      - name: Reconstruct and repair input_v3
        run: bash data_room/scripts/ym_v174_final/reassemble_input_v3.sh
      - name: Decode reducer
        run: |
          python - <<'PY'
          import base64, lzma, pathlib, os
          b = pathlib.Path('data_room/scripts/ym_v174_final/run_external_norm.py.xz.b64').read_text()
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'run_external_norm.py').write_bytes(
              lzma.decompress(base64.b64decode(b)))
          PY
      - uses: actions/download-artifact@v4
        with:
          name: v174-cg-inventory
          path: ${{ runner.temp }}/inv
      - name: Restore and verify the pinned inventory
        env:
          V174_CACHE: ${{ runner.temp }}/v174-cache
        run: |
          tar xzf "$RUNNER_TEMP/inv/cg_inventory.tar.gz" -C "$RUNNER_TEMP"
          python data_room/scripts/ym_v174_final/build_cg_inventory.py \
            --verify "$RUNNER_TEMP/inv/cg_inventory_manifest.json"
          find "$RUNNER_TEMP/inv" -name 'phase.npy' -exec cp {} "$RUNNER_TEMP/v174-out/phase.npy" \; || true
          find "$RUNNER_TEMP/inv" -name 'logc.npy' -exec cp {} "$RUNNER_TEMP/v174-out/logc.npy" \; || true
      - name: Collect crossing shards
        uses: actions/download-artifact@v4
        with:
          pattern: v174-cross-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/v174-shards
      - name: Cross this source range
        env:
          V174_INPUT: ${{ runner.temp }}/v174-v3/extract
          V174_OUT: ${{ runner.temp }}/v174-out
          V174_CACHE: ${{ runner.temp }}/v174-cache
          V174_REDUCER: ${{ runner.temp }}/run_external_norm.py
          V174_SHARDS: ${{ runner.temp }}/v174-shards
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p "$V174_OUT" "$V174_SHARDS"
          # accR/accW are plain sums over independent sources, so disjoint source
          # ranges can be computed in parallel and added. The merge step then
          # requires an exact contiguous cover of [0, NLOW) before it will run.
          python - <<'PY' > /tmp/range.env
          import os
          n = 7576; k = 8; i = int(os.environ['SHARD'])
          lo = (n * i) // k; hi = (n * (i + 1)) // k
          print(f'LO={lo}\nHI={hi}')
          PY
          . /tmp/range.env
          echo "shard ${{ matrix.shard }} covering [$LO, $HI)"
          python -u data_room/scripts/ym_v174_final/driver.py cross "$LO" "$HI" 100000 \
            2>&1 | tee "$V174_OUT/cross_${{ matrix.shard }}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v174-cross-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/v174-shards
            ${{ runner.temp }}/v174-out/cross_${{ matrix.shard }}.log
          retention-days: 90

  reduce:
    name: Phase 2b - merge, emit, reduce to N_D
    needs: cross
    if: ${{ inputs.run_phase2 }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical dependencies
        run: python -m pip install --disable-pip-version-check "numpy==${PIN_NUMPY}" "scipy==${PIN_SCIPY}" opt_einsum
      - name: Reconstruct and repair input_v3
        shell: bash
        run: bash data_room/scripts/ym_v174_final/reassemble_input_v3.sh
      - name: Decode reducer
        shell: bash
        run: |
          python - <<'PY'
          import base64, lzma, pathlib, os
          b = pathlib.Path('data_room/scripts/ym_v174_final/run_external_norm.py.xz.b64').read_text()
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'run_external_norm.py'
          out.write_bytes(lzma.decompress(base64.b64decode(b)))
          PY
      - uses: actions/download-artifact@v4
        with:
          name: v174-cg-inventory
          path: ${{ runner.temp }}/inv
      - name: Restore and verify the pinned inventory
        env:
          V174_CACHE: ${{ runner.temp }}/v174-cache
        run: |
          tar xzf "$RUNNER_TEMP/inv/cg_inventory.tar.gz" -C "$RUNNER_TEMP"
          python data_room/scripts/ym_v174_final/build_cg_inventory.py \
            --verify "$RUNNER_TEMP/inv/cg_inventory_manifest.json"
      - name: Reduce to N_D
        env:
          V174_INPUT: ${{ runner.temp }}/v174-v3/extract
          V174_OUT: ${{ runner.temp }}/v174-out
          V174_CACHE: ${{ runner.temp }}/v174-cache
          V174_REDUCER: ${{ runner.temp }}/run_external_norm.py
          V174_SHARDS: ${{ runner.temp }}/v174-shards
        run: |
          mkdir -p "$V174_OUT" "$V174_SHARDS"
          D=data_room/scripts/ym_v174_final/driver.py
          python "$D" cross 0 7576 100000
          python "$D" merge
          python "$D" emit
          python "$D" reduce
      - name: Enforce the pre-registered floor
        env:
          V174_OUT: ${{ runner.temp }}/v174-out
        run: |
          python - <<'PY'
          import json, os, pathlib, sys
          p = pathlib.Path(os.environ['V174_OUT']) / 'a10_B10_component10.json'
          r = json.loads(p.read_text())
          floor = float(os.environ['N_D_FLOOR'])
          print(json.dumps(r, indent=2))
          fail = []
          if r['N_D'] < floor:
              fail.append(f"N_D {r['N_D']!r} below the forced floor {floor!r}")
          if not r['psd']:
              fail.append(f"B*B not PSD: {r['B10_1_star_B10_1']!r}")
          if fail:
              print('FAILED:'); [print(' -', f) for f in fail]; sys.exit(1)
          print('N_D clears the floor and B*B is PSD.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v174-reduction-results
          path: ${{ runner.temp }}/v174-out
          retention-days: 90
